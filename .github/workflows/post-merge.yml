name: Post-Merge Checks

on:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: post-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check Changed Files
    # GitHub 托管 runner——ubuntu-24.04 在此链路上无可用 runner（历史 run 全部 queued 挂死）
    runs-on: ubuntu-24.04
    outputs:
      web-e2e-dual-changed: ${{ steps.changes.outputs.web_e2e_dual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            # 双轨（M2 冻结口径）：webapp 双轨涉及面——两轨前端 + e2e harness + 后端 + 契约。
            # 对齐 main-ci 的 e2e 过滤，另补 web-new/（新轨）与 baselines/*-unit-testids.json（新轨选择器消费）。
            web_e2e_dual:
              - 'api/**'
              - 'e2e/**'
              - 'web/**'
              - 'web-new/**'
              - 'packages/**'
              - 'baselines/*-unit-testids.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'docker/docker-compose.middleware.yaml'
              - 'docker/envs/middleware.env.example'
              - '.github/workflows/web-e2e.yml'
              - '.github/workflows/post-merge.yml'
              - '.github/actions/setup-web/**'

  # External Runtime E2E 已摘除（2026-10-12）：无 OpenAI 账号，E2E_MODEL_PROVIDER_CREDENTIALS_JSON
  # secret 缺位致整链常红。恢复 = 仓管配 secret 后还原本段（见 git 历史）+ check-changes
  # 的 external_e2e 过滤与 outputs 行。
  # M2 冻结转正：push 链默认双轨（旧轨 :3000 + 新轨 :3001 串行 + 契约 diff = 0 门禁）。
  # 与 external-e2e 互斥拆开——web-e2e.yml 中 dual 仅在非 external 分支生效。
  web-e2e-dual:
    name: Web Full-Stack E2E (dual-track)
    needs: check-changes
    if: needs.check-changes.outputs.web-e2e-dual-changed == 'true'
    uses: ./.github/workflows/web-e2e.yml
    with:
      run-external-runtime: false
      dual: true
    secrets: inherit
