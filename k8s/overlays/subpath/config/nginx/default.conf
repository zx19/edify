server {
    listen 80;
    server_name _;

    # 协作 WebSocket：socket.io client 固定请求根路径 /socket.io（子路径会被当作
    # namespace），因此此 location 不带 /lomva 前缀；Ingress 需同步路由 /socket.io/
    location /socket.io/ {
      proxy_pass http://api-websocket:5001;
      include proxy.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }

    # 以下 location 把 /lomva 前缀剥离后转发给 api（proxy_pass 带 URI 部分即替换匹配前缀）
    location /lomva/console/api {
      proxy_pass http://api:5001/console/api;
      include proxy.conf;
    }

    location /lomva/api {
      proxy_pass http://api:5001/api;
      include proxy.conf;
    }

    location /lomva/v1 {
      proxy_pass http://api:5001/v1;
      include proxy.conf;
    }

    location /lomva/openapi {
      proxy_pass http://api:5001/openapi;
      include proxy.conf;
    }

    location /lomva/files {
      proxy_pass http://api:5001/files;
      include proxy.conf;
    }

    location /lomva/mcp {
      proxy_pass http://api:5001/mcp;
      include proxy.conf;
    }

    location /lomva/triggers {
      proxy_pass http://api:5001/triggers;
      include proxy.conf;
    }

    location /lomva/e/ {
      proxy_pass http://plugin-daemon:5002/e/;
      proxy_set_header Dify-Hook-Url $scheme://$host$request_uri;
      include proxy.conf;
    }

    # web 前端镜像以 NEXT_PUBLIC_BASE_PATH=/lomva 构建，保留完整路径转发
    location /lomva/ {
      proxy_pass http://web:3000;
      include proxy.conf;
    }

    # Next.js 默认 trailingSlash:false，会把 /lomva/ 308 回 /lomva；而 nginx 对
    # 斜杠结尾的 proxy location 会把 /lomva 301 到 /lomva/，两者构成重定向死循环。
    # 此处把 /lomva/ 精确改写为 /lomva 转发（Next 的规范 URL），环即断开
    location = /lomva/ {
      proxy_pass http://web:3000/lomva;
      include proxy.conf;
    }
}
