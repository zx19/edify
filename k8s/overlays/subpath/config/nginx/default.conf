# 透传上游 ingress 的协议，无该头时（如 kube-probe 直连）回退为本机 scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # nginx 自身重定向(/lomva -> /lomva/)默认生成绝对 URL 且用 $scheme(http)，
    # fetch 跟随后触发 Mixed Content；改为相对 Location，浏览器保持在 https
    absolute_redirect off;

    # 协作 WebSocket：socket.io client 固定请求根路径 /socket.io（子路径会被当作
    # namespace），因此此 location 不带 /lomva 前缀；Ingress 需同步路由 /socket.io/
    location /socket.io/ {
      proxy_pass http://api-websocket:5001;
      include proxy.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }

    # 以下 location 把 /lomva 前缀剥离后转发给 api（proxy_pass 带 URI 部分即替换匹配前缀）
    location /lomva/console/api {
      proxy_pass http://api:5001/console/api;
      include proxy.conf;
    }

    location /lomva/api {
      proxy_pass http://api:5001/api;
      include proxy.conf;
    }

    location /lomva/v1 {
      proxy_pass http://api:5001/v1;
      include proxy.conf;
    }

    location /lomva/openapi {
      proxy_pass http://api:5001/openapi;
      include proxy.conf;
    }

    location /lomva/files {
      proxy_pass http://api:5001/files;
      include proxy.conf;
    }

    location /lomva/mcp {
      proxy_pass http://api:5001/mcp;
      include proxy.conf;
    }

    location /lomva/triggers {
      proxy_pass http://api:5001/triggers;
      include proxy.conf;
    }

    location /lomva/e/ {
      proxy_pass http://plugin-daemon:5002/e/;
      # daemon 对单段路径会 301 到 /e/<id>/（丢 /lomva 前缀，浏览器跟随后 404），
      # 在代理层把 Location 补回前缀
      proxy_redirect /e/ /lomva/e/;
      proxy_set_header Dify-Hook-Url $scheme://$host$request_uri;
      include proxy.conf;
    }

    # web 前端镜像以 NEXT_PUBLIC_BASE_PATH=/lomva 构建，保留完整路径转发
    location /lomva/ {
      proxy_pass http://web:3000;
      include proxy.conf;
    }

    # Next.js 默认 trailingSlash:false，规范 URL 是 /lomva（无斜杠）；/lomva/ 会被
    # Next 308 回 /lomva，而 nginx 对斜杠结尾 location 的目录式 301 又指回 /lomva/，
    # 两者互指成死循环。以下两个精确匹配分别接住两种形态、都改写为规范 URL 直转，
    # 不发任何重定向（query 会被 proxy_pass 自动保留）
    location = /lomva {
      proxy_pass http://web:3000;
      include proxy.conf;
    }

    location = /lomva/ {
      proxy_pass http://web:3000/lomva;
      include proxy.conf;
    }
}
