apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 测试环境（QA）：https://qa-xai.xingshulin.com/lomva，外部自建 PG（独立域名）
namespace: qa-ai-lomva

resources:
  - ../subpath
  - ingress.yaml
  - web-new.yaml

configMapGenerator:
  - name: lomva-config
    behavior: merge
    envs:
      - config/public-urls.env
      - config/external-services.env
  - name: lomva-web-config
    behavior: merge
    envs:
      - config/web-public.env
  # 新轨并存轨（/lomva-new）web 配置差异键（仅 NEXT_PUBLIC_BASE_PATH），
  # 经 web-new.yaml 双源 envFrom 叠加在 lomva-web-config 之上（后者覆盖前者同 key）。
  # 注意：generator env 文件受 kustomize 安全限制不能引用 overlay 目录外（../../base 不行）
  - name: lomva-web-new-config
    envs:
      - config/web-new-public.env
  # qa 在 subpath 之上再 replace 一次 nginx 配置：加入 /lomva-new 路由
  #（replace 会替换整个 ConfigMap，三文件须全量，nginx.conf/proxy.conf 为相同副本）
  - name: lomva-nginx-config
    behavior: replace
    files:
      - nginx.conf=config/nginx/nginx.conf
      - proxy.conf=config/nginx/proxy.conf
      - default.conf=config/nginx/default.conf

secretGenerator:
  - name: lomva-secret
    behavior: merge
    envs:
      - config/secret.env

# 本集群使用 qa-cbs 存储类（不依赖默认类；对全部 PVC 生效，包括可选组件带入的）
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: qa-cbs

  # 例外：app-storage 被 api/api-websocket/worker 三个 Deployment 共挂，
  # RWO 云盘跨节点 Multi-Attach 会死锁，改用 CFS（RWX）允许多节点共挂
  - target:
      kind: PersistentVolumeClaim
      name: lomva-app-storage
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteMany
      - op: replace
        path: /spec/storageClassName
        value: qa-cfs

# 镜像来源（.github/workflows/lomva-build-push.yml 手动触发构建推送）：
# - web 必须自建（NEXT_PUBLIC_BASE_PATH=/lomva 构建期参数）
# - api/agent-backend/agent-local-sandbox 也用自建镜像：fork 与上游 1.16.1 已有接口
#   分叉（如 /console/api/workspaces/current/summary 仅存在于 fork），上游镜像会 404
images:
  - name: langgenius/dify-web
    newName: z123x/lomva-web
    newTag: 1.17.0-edify-3
  - name: langgenius/dify-api
    newName: z123x/lomva-api
    newTag: 1.17.0-edify-5
  - name: langgenius/dify-agent-backend
    newName: z123x/lomva-agent-backend
    newTag: 1.17.0-edify-3
  - name: langgenius/dify-agent-local-sandbox
    newName: z123x/lomva-agent-local-sandbox
    newTag: 1.17.0-edify-3
  # 新轨并存轨镜像（build-web-new job 构建，basePath=/lomva-new 构建期固化）
  - name: z123x/lomva-web-new
    newTag: 1.17.0-edify-6
