apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 测试环境（QA）：https://qa-xai.xingshulin.com/lomva，外部自建 PG（独立域名）
namespace: qa-ai

resources:
  - ../subpath
  - namespace.yaml
  - ingress.yaml

configMapGenerator:
  - name: lomva-config
    behavior: merge
    envs:
      - config/public-urls.env
      - config/external-services.env
  - name: lomva-web-config
    behavior: merge
    envs:
      - config/web-public.env

secretGenerator:
  - name: lomva-secret
    behavior: merge
    envs:
      - config/secret.env

# 自建镜像推送后，取消注释并把地址换成你的仓库：
