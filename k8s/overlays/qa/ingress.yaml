apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lomva
  annotations:
    # 本集群使用 nginx-ingress controller（class 名 nginx-ingress，见 dify-nginx-ingress），
    # 规则会合并进 qa-xai.xingshulin.com 所在的共享 CLB，不会新建 CLB
    # 大文件上传（默认上限 15MB）需要放大 controller 的 body 限制
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    # LLM SSE 流式响应可能长时间无新字节，放大读写超时避免被截断
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-ingress
  rules:
    - host: qa-xai.xingshulin.com
      http:
        paths:
          # 应用主体（子路径部署；完整 URI 透传给 nginx Service，由它剥离前缀）
          # path 不带尾斜杠：部分 controller 对 Prefix + 尾斜杠告警；Prefix 同样覆盖 /lomva 与 /lomva/...
          # 协作 WebSocket 走 /lomva/socket.io/（web 端 path 带 basePath），不再占用根路径 /socket.io
          - path: /lomva
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
