apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lomva
  annotations:
    # TKE CLB Ingress Controller
    kubernetes.io/ingress.class: qcloud
spec:
  rules:
    - host: qa-xai.xingshulin.com
      http:
        paths:
          # 应用主体（子路径部署）
          - path: /lomva/
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
          # 协作 WebSocket（socket.io client 固定请求根路径，见 overlay 的 nginx default.conf）
          - path: /socket.io/
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
