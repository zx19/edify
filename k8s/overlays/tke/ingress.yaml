apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lomva
  annotations:
    # TKE CLB Ingress Controller
    kubernetes.io/ingress.class: qcloud
spec:
  rules:
    # 部署前改为实际域名；改完后同步更新 base/config/lomva-config.env 里的外部 URL 配置
    - host: lomva.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
