apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lomva
  annotations:
    # nginx-ingress controller；大文件上传与 SSE 流式需要以下注解
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-ingress   # 若线上集群的 class 不同请修改
  rules:
    # 部署前改为线上一域名
    - host: lomva.example.com
      http:
        paths:
          # 应用主体（子路径部署；完整 URI 透传给 nginx Service，由它剥离前缀）
          - path: /lomva/
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
          # 协作 WebSocket（socket.io client 固定请求根路径，见 overlays/subpath 的 nginx default.conf）
          - path: /socket.io/
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
