apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lomva
  annotations:
    # nginx-ingress controller；大文件上传与 SSE 流式需要以下注解
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-ingress   # 若线上集群的 class 不同请修改
  rules:
    # 部署前改为线上一域名
    - host: lomva.example.com
      http:
        paths:
          # 应用主体（子路径部署；完整 URI 透传给 nginx Service，由它剥离前缀）
          # path 不带尾斜杠：部分 controller 对 Prefix + 尾斜杠告警；Prefix 同样覆盖 /lomva 与 /lomva/...
          # 协作 WebSocket 走 /lomva/socket.io/（web 端 path 带 basePath），不再占用根路径 /socket.io
          - path: /lomva
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
