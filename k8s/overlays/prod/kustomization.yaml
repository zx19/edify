apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 线上环境：外部 TencentDB PG。部署前必改：
#   namespace（下方 prod-ai-lomva）、域名（ingress.yaml + config/public-urls.env + config/web-public.env）、
#   config/external-services.env（DB_HOST）、config/secret.env（DB_PASSWORD 等）、images 仓库地址
namespace: prod-ai-lomva   # 按需修改（线上命名空间；若线上在独立集群，注意切换 kubectl context）

resources:
  - ../subpath
  - ingress.yaml

configMapGenerator:
  - name: lomva-config
    behavior: merge
    envs:
      - config/public-urls.env
      - config/external-services.env
  - name: lomva-web-config
    behavior: merge
    envs:
      - config/web-public.env

secretGenerator:
  - name: lomva-secret
    behavior: merge
    envs:
      - config/secret.env

# 线上集群使用 prod-cbs 存储类（对全部 PVC 生效，包括可选组件带入的）
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: prod-cbs

  # 例外：app-storage 被 api/api-websocket/worker 三个 Deployment 共挂，
  # RWO 云盘跨节点 Multi-Attach 会死锁，改用 CFS（RWX）允许多节点共挂。
  # 前提：线上集群需存在 prod-cfs 存储类（csi.cfs, ReadWriteMany）
  - target:
      kind: PersistentVolumeClaim
      name: lomva-app-storage
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteMany
      - op: replace
        path: /spec/storageClassName
        value: prod-cfs

# 自建镜像推送后取消注释并替换仓库地址（示例见 overlays/qa/kustomization.yaml）
# images: []
