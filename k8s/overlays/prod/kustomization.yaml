apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 线上环境：外部 TencentDB PG。部署前必改：
#   namespace（下方 prod-ai）、域名（ingress.yaml + config/public-urls.env + config/web-public.env）、
#   config/external-services.env（DB_HOST）、config/secret.env（DB_PASSWORD 等）、images 仓库地址
namespace: prod-ai   # 按需修改（线上命名空间；若线上在独立集群，注意切换 kubectl context）

resources:
  - ../subpath
  - namespace.yaml
  - ingress.yaml

configMapGenerator:
  - name: lomva-config
    behavior: merge
    envs:
      - config/public-urls.env
      - config/external-services.env
  - name: lomva-web-config
    behavior: merge
    envs:
      - config/web-public.env

secretGenerator:
  - name: lomva-secret
    behavior: merge
    envs:
      - config/secret.env

# 自建镜像推送后取消注释并替换仓库地址（示例见 overlays/qa/kustomization.yaml）
# images: []
