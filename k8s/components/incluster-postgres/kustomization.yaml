apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# 集群内自建 PostgreSQL（可选组件）：
# - overlays/local 引用它，供 kind 本地验证使用
# - overlays/qa（外部自建 PG）与 overlays/prod（TencentDB）均不引用
# 如某环境需改回集群内自建：在该环境的 kustomization.yaml 加
#   components:
#     - ../../components/incluster-postgres
# 并把该环境 config/external-services.env 里的 DB_HOST 改回 postgres

resources:
  - postgres.yaml
