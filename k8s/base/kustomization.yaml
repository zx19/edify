apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa-ai

resources:
  - namespace.yaml

configMapGenerator:
  - name: lomva-config
    envs:
      - config/lomva-config.env
  - name: lomva-web-config
    envs:
      - config/web-config.env

secretGenerator:
  - name: lomva-secret
    type: Opaque
    envs:
      - config/lomva-secret.env

images:
  - name: langgenius/dify-api
    newTag: 1.16.1
  - name: langgenius/dify-web
    newTag: 1.16.1
  - name: langgenius/dify-sandbox
    newTag: 0.2.15
  - name: langgenius/dify-agent-local-sandbox
    newTag: 1.16.1
  - name: langgenius/dify-plugin-daemon
    newTag: 0.6.10-local
  - name: langgenius/dify-agent-backend
    newTag: 1.16.1
  - name: postgres
    newTag: 15-alpine
  - name: redis
    newTag: 6-alpine
  - name: semitechnologies/weaviate
    newTag: 1.27.0
  - name: ubuntu/squid
    newTag: latest
  - name: nginx
    newTag: 1.27-alpine
  - name: busybox
    newTag: "1.36"
