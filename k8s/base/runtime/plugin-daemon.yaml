apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lomva-plugin-storage
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi   # TKE CBS 最小 10Gi（[10, 32000]），勿调小
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lomva-plugin-daemon
  labels:
    app: plugin-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-daemon
  template:
    metadata:
      labels:
        app: plugin-daemon
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox
          envFrom:
            - configMapRef:
                name: lomva-config
          command:
            - sh
            - -c
            - |
              until nc -z "$DB_HOST" "$DB_PORT"; do
                echo waiting for "$DB_HOST:$DB_PORT"
                sleep 2
              done
      containers:
        - name: plugin-daemon
          image: langgenius/dify-plugin-daemon
          envFrom:
            - configMapRef:
                name: lomva-config
            - secretRef:
                name: lomva-secret
          env:
            - name: SERVER_PORT
              value: "5002"
            - name: SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: lomva-secret
                  key: PLUGIN_DAEMON_KEY
            - name: DIFY_INNER_API_URL
              value: http://api:5001
            - name: DIFY_INNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lomva-secret
                  key: PLUGIN_DIFY_INNER_API_KEY
            - name: DB_DATABASE
              value: lomva_plugin
            - name: DB_SSL_MODE
              value: disable
            - name: MAX_PLUGIN_PACKAGE_SIZE
              value: "52428800"
            - name: PPROF_ENABLED
              value: "false"
            - name: PLUGIN_REMOTE_INSTALLING_HOST
              value: 0.0.0.0
            - name: PLUGIN_REMOTE_INSTALLING_PORT
              value: "5003"
            - name: PLUGIN_WORKING_PATH
              value: /app/storage/cwd
            - name: FORCE_VERIFYING_SIGNATURE
              value: "true"
            - name: PYTHON_ENV_INIT_TIMEOUT
              value: "120"
            - name: PLUGIN_MAX_EXECUTION_TIMEOUT
              value: "600"
            - name: PLUGIN_STDIO_BUFFER_SIZE
              value: "1024"
            - name: PLUGIN_STDIO_MAX_BUFFER_SIZE
              value: "5242880"
            - name: PLUGIN_STORAGE_TYPE
              value: local
            - name: PLUGIN_STORAGE_LOCAL_ROOT
              value: /app/storage
            - name: PLUGIN_INSTALLED_PATH
              value: plugin
            - name: PLUGIN_PACKAGE_CACHE_PATH
              value: plugin_packages
            - name: PLUGIN_MEDIA_CACHE_PATH
              value: assets
          ports:
            - containerPort: 5002
            - containerPort: 5003
          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: lomva-plugin-storage
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-daemon
spec:
  selector:
    app: plugin-daemon
  ports:
    - port: 5002
      targetPort: 5002
