apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lomva-sandbox-deps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  labels:
    app: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      containers:
        - name: sandbox
          image: langgenius/dify-sandbox
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: lomva-secret
                  key: CODE_EXECUTION_API_KEY
            - name: GIN_MODE
              value: release
            - name: WORKER_TIMEOUT
              value: "15"
            - name: ENABLE_NETWORK
              value: "true"
            - name: HTTP_PROXY
              value: http://ssrf-proxy:3128
            - name: HTTPS_PROXY
              value: http://ssrf-proxy:3128
            - name: SANDBOX_PORT
              value: "8194"
          ports:
            - containerPort: 8194
          readinessProbe:
            httpGet:
              path: /health
              port: 8194
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /conf/config.yaml
              subPath: config.yaml
            - name: dependencies
              mountPath: /dependencies
      volumes:
        - name: config
          configMap:
            name: lomva-sandbox-config
        - name: dependencies
          persistentVolumeClaim:
            claimName: lomva-sandbox-deps
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
spec:
  selector:
    app: sandbox
  ports:
    - port: 8194
      targetPort: 8194
