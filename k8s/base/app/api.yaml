apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-middleware
          image: busybox
          envFrom:
            - configMapRef:
                name: lomva-config
          command:
            - sh
            - -c
            - |
              until nc -z "$DB_HOST" "$DB_PORT" && nc -z redis 6379; do
                echo waiting for "$DB_HOST:$DB_PORT"/redis
                sleep 2
              done
        - name: wait-init
          image: busybox
          command:
            - sh
            - -c
            - |
              until [ -f /app/api/storage/.init_permissions ]; do
                echo waiting for init-permissions job
                sleep 2
              done
          volumeMounts:
            - name: storage
              mountPath: /app/api/storage
      containers:
        - name: api
          image: langgenius/dify-api
          envFrom:
            - configMapRef:
                name: lomva-config
            - secretRef:
                name: lomva-secret
          env:
            - name: MODE
              value: api
          ports:
            - containerPort: 5001
          startupProbe:
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /app/api/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: lomva-app-storage
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 5001
      targetPort: 5001
